<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { 
  getDatabase, ref, set, get, push, update, onValue, remove 
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyCE9UY3P3oEFZ_cgX7d5Ox0lFZiL_9Uszs",
  authDomain: "accesoriostr-7f01e.firebaseapp.com",
  databaseURL: "https://accesoriostr-7f01e-default-rtdb.firebaseio.com",
  projectId: "accesoriostr-7f01e",
  storageBucket: "accesoriostr-7f01e.firebasestorage.app",
  messagingSenderId: "927871540022",
  appId: "1:927871540022:web:eb4a9a446cc0a6530a7197"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
function registrarAccion(accion, modulo, detalles = {}) {
    const user = auth.currentUser;
    if (!user) return;
    const registro = {
      fecha: new Date().toISOString(),
      uid: user.uid,
      correo: user.email,
      accion,
      modulo,
      detalles
    };
    push(ref(db, "registros_ci"), registro);
  }
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      Swal.fire("Sesión cerrada", "Debes iniciar sesión para acceder", "info")
        .then(() => window.location.href = "index.html");
    }
  });
  const CLAVE_PRECIO_BAJO = "1004"; // 👉 cambia esto

  async function confirmarPrecioBajo({ precioUnit, precioSugerido, precioTope }) {
  const { value: password } = await Swal.fire({
    icon: "warning",
    title: "Precio menor al permitido",
    html: `
      <p><strong>Precio ingresado:</strong> ${q(precioUnit)}</p>
      <p><strong>Precio sugerido:</strong> ${!isNaN(precioSugerido) ? q(precioSugerido) : "-"}</p>
      <p><strong>Precio tope:</strong> ${q(precioTope)}</p>
      <hr>
      <p>Para continuar, ingresa la contraseña:</p>
    `,
    input: "password",
    inputPlaceholder: "Contraseña",
    showCancelButton: true,
    confirmButtonText: "Autorizar venta",
    cancelButtonText: "Cancelar",
    preConfirm: (input) => {
      if (!input) {
        Swal.showValidationMessage("Debes ingresar la contraseña");
        return false;
      }
      if (input !== CLAVE_PRECIO_BAJO) {
        Swal.showValidationMessage("Contraseña incorrecta");
        return false;
      }
      return true;
    }
  });

  return !!password;
}
const formaPagoInput = document.getElementById("ventaFormaPago");
const diasCreditoInput = document.getElementById("ventaDiasCredito");
const contenedorDiasCredito = document.getElementById("contenedorDiasCredito");
const clienteInput = document.getElementById("ventaClienteTexto");
const vendedorInput = document.getElementById("ventaVendedor");
const listaClientes = document.getElementById("listaClientes");
const productoInput = document.getElementById("ventaProductoTexto");
const listaProductos = document.getElementById("listaProductos");
  const cantidadInput  = document.getElementById("ventaCantidad");
  const precioInput    = document.getElementById("ventaPrecio");
  const tablaBody      = document.querySelector("#tablaCarrito tbody");
  const totalDisplay   = document.getElementById("ventaTotal");
  const listaVentas    = document.getElementById("lista-ventas");
  const filtroCliente  = document.getElementById("filtroCliente");
  const filtroFecha    = document.getElementById("filtroFecha");
const comprobanteInput = document.getElementById("ventaComprobante");
const imagenInput = document.getElementById("ventaImagen");
const contenedorTransferencia = document.getElementById("contenedorTransferencia");

  let carrito = [];
  let idVentaEditando = null;
  let productosCache = {};
  let clientesCache = {};
  let historial = {};
  let productDisplayMap = {};
  function leerNumero(v) {
    if (v === undefined || v === null) return NaN;
    if (typeof v === "number") return v;
    if (typeof v === "string") {
      const limpio = v.replace(/[^\d,.-]/g, "").replace(",", ".");
      const n = parseFloat(limpio);
      return isNaN(n) ? NaN : n;
    }
    return NaN;
  }
  function q(n) { return "Q" + Number(n || 0).toFixed(2); }
  function obtenerCosto(prod) {
    const claves = [
      "costo","precioCosto","costo_unitario","precioCostoUnitario",
      "precio_costo","precioCompra","precio_compra","costoCompra"
    ];
    for (const k of claves) {
      const n = leerNumero(prod?.[k]);
      if (!isNaN(n)) return n;
    }
    const fb = leerNumero(prod?.precio);
    return isNaN(fb) ? NaN : fb;
  }
  function obtenerPrecioSugerido(prod) {
  return leerNumero(
    prod?.precioSugerido ??
    prod?.precio_sugerido ??
    prod?.precioVenta ??
    prod?.precio
  );
}

function obtenerPrecioTope(prod) {
  return leerNumero(
    prod?.precioTope ??
    prod?.precio_tope ??
    prod?.precioMinimo ??
    prod?.precio_minimo
  );
}

window.addEventListener("DOMContentLoaded", () => {
  get(ref(db, "clientes")).then((snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    Object.entries(data).forEach(([codigo, cliente]) => {
  clientesCache[codigo] = cliente;

  const option = document.createElement("option");
  option.value = `${cliente.nombre} ${cliente.apellido ?? ""}`.trim(); // 👈 lo que se escribe
  listaClientes.appendChild(option); // ✅ CORRECTO
});

    renderizarVentas(); // ✅ CLAVE
  });





// CARGAR PRODUCTOS

get(ref(db, "productos_ci")).then(snapshot => {
  const data = snapshot.val() || {};

  listaProductos.innerHTML = "";

  Object.entries(data).forEach(([codigo, producto]) => {
   productosCache[producto.codigo] = producto;

    const option = document.createElement("option");
option.value = `${producto.codigo} - ${producto.nombre}`;
    listaProductos.appendChild(option);
  });
});
productoInput.addEventListener("change", () => {
  const texto = productoInput.value;

  const codigo = texto.split(" - ")[0].trim(); // extrae el código
  const producto = productosCache[codigo];

 if (!producto) {
  precioInput.value = "";
  precioInput.disabled = false; // 👈 permite escribir precio
  return;
}


  const costo = obtenerCosto(producto);
  precioInput.value = !isNaN(costo) ? costo : "";
  precioInput.disabled = false;

  if (window.componentHandler) componentHandler.upgradeDom();
});

 });

function renderizarCarrito() {
    tablaBody.innerHTML = "";
    let total = 0;
    carrito.forEach((item, i) => {
      const subtotal = item.cantidad * item.precio;
      total += subtotal;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.nombre}</td>
        <td>${item.cantidad}</td>
        <td>${q(item.precio)}</td>
        <td>${q(subtotal)}</td>
        <td><button onclick="eliminarDelCarrito(${i})" class="mdl-button mdl-button--icon">
          <i class="zmdi zmdi-close"></i></button></td>
      `;
      tablaBody.appendChild(tr);
    });
    totalDisplay.textContent = q(total);
  }
  window.eliminarDelCarrito = function (index) {
    carrito.splice(index, 1);
    renderizarCarrito();
  };
  
document.getElementById("btn-agregarCarrito").addEventListener("click", async (e) => {
  e.preventDefault();

  const texto = productoInput.value;
const codigo = texto.split(" - ")[0];

  const cantidad = parseInt(cantidadInput.value.trim());
const prod = productosCache[codigo] || null;

  const esVentaLibre = !prod;

  let precioSugerido = null;
  let precioTope = null;

  if (!esVentaLibre) {
    precioSugerido = obtenerPrecioSugerido(prod);
    precioTope = obtenerPrecioTope(prod);
  }


 if (
  ( !esVentaLibre && !codigo ) ||
  isNaN(cantidad) ||
  cantidad <= 0
) {
  Swal.fire("Datos requeridos", "Selecciona producto y cantidad válida", "warning");
  return;
}


  if (!esVentaLibre && cantidad > (prod.cantidad ?? 0)) {
  Swal.fire("Sin stock", `Solo hay ${prod.cantidad} disponibles`, "error");
  return;
}


  const precioUnit = Number(precioInput.value);
  if (isNaN(precioUnit) || precioUnit <= 0) {
    Swal.fire("Precio inválido", "Ingresa un precio válido", "warning");
    return;
  }
   // 🔐 VALIDACIÓN DE PRECIO BAJO (SOLO PRODUCTOS REALES)
  if (!esVentaLibre && !isNaN(precioTope) && precioUnit < precioTope) {
    const autorizado = await confirmarPrecioBajo({
      precioUnit,
      precioSugerido,
      precioTope
    });

    if (!autorizado) return;
  }

  // ✅ AGREGAR AL CARRITO
const existente = carrito.find(p =>
  (p.codigo === codigo || p.libre) &&
  p.nombre === (esVentaLibre ? productoInput.value : prod.nombre) &&
  p.precio === precioUnit
);

  if (existente) {
    if ((existente.cantidad + cantidad) > (prod.cantidad ?? 0)) {
      Swal.fire("Stock insuficiente", "Superas la cantidad disponible", "error");
      return;
    }
    existente.cantidad += cantidad;
  } else {
   carrito.push({
  codigo: esVentaLibre ? null : codigo,
  nombre: esVentaLibre ? productoInput.value : prod.nombre,
  precio: precioUnit,
  cantidad,
  libre: esVentaLibre
});

  }

  cantidadInput.value = "";
  renderizarCarrito();
  if (window.componentHandler) componentHandler.upgradeDom();
});


formaPagoInput.addEventListener("change", () => {

  contenedorDiasCredito.style.display = "none";
  contenedorTransferencia.style.display = "none";

  if (formaPagoInput.value === "credito") {
    contenedorDiasCredito.style.display = "block";
  }

  if (formaPagoInput.value === "transferencia") {
    contenedorTransferencia.style.display = "block";
  }

  if (window.componentHandler) componentHandler.upgradeDom();
});

document.getElementById("btn-finalizarVenta").addEventListener("click", async () => {
    
const clienteTexto = clienteInput.value.trim();
const vendedor = vendedorInput.value.trim();

if (!vendedor) {
  Swal.fire("Falta vendedor", "Debes ingresar el nombre del vendedor", "warning");
  return;
}
const formaPago = formaPagoInput.value;
const diasCredito = parseInt(diasCreditoInput.value) || 0;
const comprobante = comprobanteInput.value.trim();

if (formaPago === "credito" && diasCredito <= 0) {
  Swal.fire("Crédito inválido", "Debes indicar los días de crédito", "warning");
  return;
}

if (formaPago === "transferencia" && !comprobante) {
  Swal.fire("Falta comprobante", "Debes ingresar el número de comprobante", "warning");
  return;
}

if (!clienteTexto) {
  Swal.fire("Selecciona o escribe un cliente", "", "info");
  return;
}

const clienteEncontrado = Object.entries(clientesCache).find(([codigo, cliente]) => {
  const nombreCompleto = `${cliente.nombre} ${cliente.apellido ?? ""}`.trim().toLowerCase();
  return nombreCompleto === clienteTexto.toLowerCase();
});

const clienteCodigo = clienteEncontrado ? clienteEncontrado[0] : null;
const clienteNombreLibre = clienteEncontrado ? null : clienteTexto;

    if (carrito.length === 0) {
      Swal.fire("Carrito vacío", "Agrega al menos un producto", "warning");
      return;
    }

    let imagenBase64 = null;

if (formaPago === "transferencia" && imagenInput.files[0]) {
  const file = imagenInput.files[0];

  imagenBase64 = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

    const venta = {
      vendedor,
  cliente: clienteCodigo,
  clienteLibre: clienteCodigo ? null : clienteNombreLibre,
  fecha: new Date().toISOString().split("T")[0],
  formaPago,
diasCredito: formaPago === "credito" ? diasCredito : 0,
comprobante: formaPago === "transferencia" ? comprobante : null,
imagenComprobante: imagenBase64,
estadoPago: formaPago === "credito" ? "pendiente" : "pagado",
  total: carrito.reduce((t, p) => t + (p.precio * p.cantidad), 0),
  productos: carrito.map(p => ({
    codigo: p.codigo || null,
    nombre: p.nombre,
    cantidad: p.cantidad,
    precio: p.precio,
    libre: p.libre || false
  }))
};
    get(ref(db, "ventas")).then(snapshot => {
      const data = snapshot.val() || {};
      const codigos = Object.values(data)
        .map(v => parseInt((v.codigo || "V000").replace("V", "")))
        .filter(n => !isNaN(n));

    async function imprimirMitad(yOffset, copiaTexto) {

    startY: yOffset + 45,

  const yFinal = doc.lastAutoTable.finalY;

}

  function numALetras(numStr) {
    const UNIDADES = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
    const DECENAS  = ["", "diez", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
    const CENTENAS = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
    const ESPECIALES = { 10:"diez", 11:"once", 12:"doce", 13:"trece", 14:"catorce", 15:"quince", 20:"veinte" };
    function convertirGrupo(n) {
      let out = "";
      const c = Math.floor(n / 100);
      const d = Math.floor((n % 100) / 10);
      const u = n % 10;
      if (n === 0) return "";
      if (n === 100) return "cien";
      if (c) out += CENTENAS[c] + " ";
      if (n % 100 >= 10 && n % 100 <= 15) return (out + ESPECIALES[n % 100]).trim();
      if (n % 100 === 20) return (out + "veinte").trim();
      if (d >= 2) {
        out += DECENAS[d];
        if (u) out += " y " + UNIDADES[u];
      } else if (d === 1) {
        out += ESPECIALES[10 + u];
      } else if (u) {
        out += UNIDADES[u];
      }
      return out.trim();
    }
    function seccion(valor, nombre) {
      if (valor === 0) return "";
      if (valor === 1 && nombre === "mil") return "mil ";
      return (convertirGrupo(valor) + " " + nombre + " ").trim() + " ";
    }
    const [enteroStr, decimalStr] = String(numStr).split(".");
    const entero = parseInt(enteroStr || "0");
    const centavos = parseInt(decimalStr || "0");
    if (entero > 999999) return "Cantidad demasiado grande";
    const miles   = Math.floor(entero / 1000);
    const cientos = entero % 1000;
    let letras = "";
    letras += seccion(miles, "mil");
    letras += convertirGrupo(cientos);
    letras = letras.trim();
    if (!letras) letras = "cero";
    letras = letras.charAt(0).toUpperCase() + letras.slice(1);
    const centavoTexto = centavos ? ` con ${centavos}/100` : "";
    return `${letras} quetzales${centavoTexto}`;
  }
